name: ModTRS
version: '3.0.0-SNAPSHOT'
main: org.nubcraft.modtrs.ModTRS
api-version: '1.21.8'
author: Greg Elsbernd
description: NubCraft moderator request ticket system

commands:
  modreq:
    description: Request assistance from server staff
    usage: /modreq <message>
    aliases: [modrequest]
    permission: modtrs.command.modreq
  check:
    description: List moderator requests available to you
    usage: /check [page]
  check-id:
    description: Show a moderator request
    usage: /check-id <id>
    aliases: [checkid]
  claim:
    description: Claim a moderator request
    usage: /claim <id>
    permission: modtrs.command.complete
  unclaim:
    description: Return a request to the open queue
    usage: /unclaim <id>
    permission: modtrs.command.complete
  complete:
    description: Complete a moderator request
    usage: /complete <id> [staff note]
    aliases: [done]
    permission: modtrs.command.complete
  reopen:
    description: Reopen a moderator request
    usage: /reopen <id>
    permission: modtrs.command.complete
  hold:
    description: Put a moderator request on hold
    usage: /hold <id>
    permission: modtrs.command.complete
  tp-id:
    description: Teleport to the location where a request was submitted
    usage: /tp-id <id>
    aliases: [tpid]
    permission: modtrs.command.teleport
  modreq-ban:
    description: Prevent a player from submitting moderator requests
    usage: /modreq-ban <player> [reason]
    permission: modtrs.command.ban
  modreq-unban:
    description: Allow a player to submit moderator requests again
    usage: /modreq-unban <player>
    permission: modtrs.command.unban
  modtrs:
    description: ModTRS administration
    usage: /modtrs reload
    permission: modtrs.admin

permissions:
  modtrs.player:
    description: Standard player access to ModTRS
    default: false
    children:
      modtrs.command.modreq: true
      modtrs.command.check.self: true

  modtrs.staff:
    description: Staff ticket management and notifications
    default: false
    children:
      modtrs.player: true
      modtrs.command.check: true
      modtrs.command.complete: true
      modtrs.command.teleport: true

  modtrs.admin:
    description: Full ModTRS administration
    default: op
    children:
      modtrs.staff: true
      modtrs.command.ban: true
      modtrs.command.unban: true

  modtrs.command.modreq:
    description: Submit moderator requests
    default: false
  modtrs.command.check.self:
    description: View your own moderator requests
    default: false
  modtrs.command.check:
    description: View all open moderator requests
    default: false
  modtrs.command.complete:
    description: Claim, hold, reopen, unclaim and complete requests
    default: false
  modtrs.command.teleport:
    description: Teleport to a request location
    default: false
  modtrs.command.ban:
    description: Ban players from submitting moderator requests
    default: false
  modtrs.command.unban:
    description: Unban players from submitting moderator requests
    default: false
